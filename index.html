<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-110vh);opacity:0;}
}

/* Main card */
.container{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(15px);
  padding:30px 25px;
  border-radius:25px;
  width:90%;
  max-width:380px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.card img{
  width:100%;
  border-radius:20px;
  margin-bottom:20px;
}

h1{
  color:#ff2f6d;
  font-size:26px;
  margin-bottom:25px;
}

/* Buttons */
.buttons{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

#yes{
  background:#ff2f6d;
  color:white;
  font-weight:600;
}
#yes:hover{
  transform:scale(1.08);
}

#no{
  background:#ddd;
}
</style>
</head>

<body>

<audio id="sound">
  <source src="https://www.soundjay.com/buttons/sounds/button-4.mp3">
</audio>

<div class="container">
  <div class="card" id="card">
    <img src="https://i.imgur.com/2nCt3Sb.png" alt="cute bear">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>
  </div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const sound=document.getElementById("sound");

// Move NO button
noBtn.addEventListener("mouseover",move);
noBtn.addEventListener("touchstart",move);

function move(){
  noBtn.style.transform=
   `translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

// YES click
yesBtn.onclick=()=>{
  sound.play();
  document.getElementById("card").innerHTML=`
    <h1 style="font-size:30px;">Yayyy 💕</h1>
    <p style="font-size:20px;color:#ff2f6d;">I Love You 😘</p>
  `;
};

// Hearts
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💖";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},400);
</script>

</body>
</html>
