<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Manshi 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f8b6c8,#f6d2d8);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.7;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  animation:fade 0.4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.top{
  font-size:14px;
  color:#888;
}

.progress{
  height:6px;
  background:#eee;
  border-radius:10px;
  margin:8px 0 20px;
  overflow:hidden;
}
.bar{
  height:100%;
  width:0%;
  background:#ff6f91;
  transition:width 0.4s;
}

.question{
  font-family:'Dancing Script',cursive;
  font-size:28px;
  text-align:center;
  margin-bottom:20px;
  color:#333;
}

.options button{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  border:none;
  font-size:15px;
  background:#f5f5f5;
}

.options button:hover{
  background:#ffedf3;
}

/* Proposal area */
.area{
  position:relative;
  height:120px;
}

#yes{
  background:#ff6f91;
  color:#fff;
  font-weight:600;
  position:absolute;
  left:15%;
}

#no{
  background:#eee;
  position:absolute;
  left:55%;
}

#msg{
  text-align:center;
  font-weight:600;
  color:#ff6f91;
  min-height:22px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");
let started=false;

const quiz=[
  {
    q:"Where did we first meet?",
    o:["At a coffee shop ☕","Through mutual friends 👥","Online 💻","At work/school 🏫"]
  },
  {
    q:"What's our favorite activity together?",
    o:["Watching movies 🎬","Cooking together 🍳","Playing games 🎮","Going on a dinner date 🍽️"]
  },
  {
    q:"What's our song?",
    o:[
      "Perfect – Ed Sheeran 🎵",
      "All of Me – John Legend 🎤",
      "Can't Help Falling in Love – Elvis 💕",
      "A Thousand Years – Christina Perri 🎶"
    ]
  }
];

let step=0;

function play(){
  if(!started){music.play().catch(()=>{});started=true;}
}

function render(){
  if(step<quiz.length){
    card.innerHTML=`
      <div class="top">Question ${step+1} of 3</div>
      <div class="progress"><div class="bar" style="width:${(step+1)/3*100}%"></div></div>
      <div class="question">${quiz[step].q}</div>
      <div class="options">
        ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
      </div>
    `;
  }else{
    proposal();
  }
}

function next(){
  play();
  step++;
  render();
}

/* FINAL PROPOSAL */
const messages=[
  "Nice try 😜",
  "Almost 😏",
  "Haha nope 😂",
  "You can’t press this 💃",
  "Only YES allowed 😍"
];
let mi=0;

function proposal(){
  card.innerHTML=`
    <div class="question">Manshi 💖</div>
    <p style="text-align:center">Will you be my Valentine?</p>
    <div id="msg"></div>
    <div class="area" id="area">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>
  `;

  const no=document.getElementById("no");
  const yes=document.getElementById("yes");
  const msg=document.getElementById("msg");
  const area=document.getElementById("area");

  function moveNo(){
    const ar=area.getBoundingClientRect();
    const br=no.getBoundingClientRect();
    no.style.left=Math.random()*(ar.width-br.width)+"px";
    no.style.top=Math.random()*(ar.height-br.height)+"px";
    msg.innerText=messages[mi];
    mi=(mi+1)%messages.length;
  }

  document.addEventListener("mousemove",e=>{
    const r=no.getBoundingClientRect();
    if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<60){
      moveNo();
    }
  });

  document.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    const r=no.getBoundingClientRect();
    if(Math.hypot(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2))<60){
      moveNo();
    }
  },{passive:true});

  yes.onclick=()=>{
    play();
    card.innerHTML=`
      <div class="question">I knew it 💕</div>
      <p style="text-align:center">You made my heart smile, Manshi 😘</p>
    `;
  };
}

render();

/* Floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},500);
</script>

</body>
</html>
