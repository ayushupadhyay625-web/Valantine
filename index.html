<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Puzzle 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f9b3c9,#f7d1db);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:26px;
  padding:30px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  text-align:center;
}

/* Buttons */
.btn{
  background:linear-gradient(135deg,#ff6f91,#ff9a9e);
  color:#fff;
  border:none;
  padding:14px 32px;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,111,145,.6);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

/* Quiz */
.question{
  font-family:'Dancing Script',cursive;
  font-size:30px;
  margin-bottom:20px;
}
.options button{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:18px;
  border:none;
  background:#ffe1ea;
  cursor:pointer;
  transition:.2s;
}
.options button:hover{transform:scale(1.05)}

/* Proposal */
.area{height:160px;position:relative}
#yes{
  background:linear-gradient(135deg,#ff6f91,#ff9a9e);
  color:#fff;
  padding:15px 34px;
  border-radius:40px;
  font-size:18px;
  position:absolute;
  left:32%;
  animation:pulse 1.3s infinite;
}
#no{
  background:#eee;
  padding:15px 28px;
  border-radius:40px;
  position:fixed;
}

/* Bubble */
.bubble{
  position:fixed;
  background:#fff;
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

/* 🎬 CINEMATIC MESSAGE */
.final-line{
  opacity:0;
  transform:scale(.6);
  filter:blur(6px);
  animation:cinema 1.2s cubic-bezier(.19,1,.22,1) forwards;
  text-shadow:0 0 12px rgba(255,111,145,.5);
}
@keyframes cinema{
  60%{opacity:1;transform:scale(1.08);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  animation:pop 3.5s linear forwards;
}
@keyframes pop{
  to{
    transform:translate(var(--x),var(--y)) rotate(1080deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1 style="font-family:Dancing Script">❤️ A Special Puzzle</h1>
  <p>Just For You 💖</p><br>
  <button class="btn" onclick="start()">❤️ Start ✨</button>
</div>

<script>
const card=document.getElementById("card");

/* QUIZ */
const quiz=[
 {q:"Where did we first meet?",o:["At a coffee shop ☕","Through friends 👥","Online 💻","At college 🏫"]},
 {q:"What do you love most about us?",o:["Our talks 💬","Our laughs 😂","Our bond 💞","Everything 😍"]},
 {q:"Do you know how special you are to me?",o:["Very 💕","A lot 🥰","Too much 😘","Infinite ♾️"]}
];
let step=0;
function start(){render()}
function render(){
 if(step<quiz.length){
  card.innerHTML=`
   <div class="question">${quiz[step].q}</div>
   <div class="options">
    ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
   </div>`;
 }else proposal();
}
function next(){step++;render()}

/* Proposal */
const noTexts=["Try again 😜","Nope 🙈","Think again 💕","Really? 😂","Not happening 😏"];
let ni=0;
function proposal(){
 card.innerHTML=`
  <div class="question">Will You Be My Valentine? 💖</div>
  <div class="area">
   <button id="yes">❤️ YES!</button>
   <button id="no">♡ No</button>
  </div>`;
 const yes=document.getElementById("yes");
 const no=document.getElementById("no");
 let scale=1;

 function moveNo(){
  no.style.left=Math.random()*(innerWidth-120)+"px";
  no.style.top=Math.random()*(innerHeight-60)+"px";
  scale+=.15; yes.style.transform=`scale(${scale})`;
  const b=document.createElement("div");
  b.className="bubble";
  b.innerText=noTexts[ni++%noTexts.length];
  b.style.left=no.style.left;
  b.style.top=(parseInt(no.style.top)-40)+"px";
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),900);
 }
 no.onmouseover=moveNo;
 no.ontouchstart=moveNo;
 yes.onclick=celebrate;
}

/* 🎉 PARTY POPPERS FROM EVERYWHERE */
function partyPopper(){
 const edges=[
  {x:0,y:0},{x:innerWidth,y:0},
  {x:0,y:innerHeight},{x:innerWidth,y:innerHeight},
  {x:innerWidth/2,y:0},{x:innerWidth/2,y:innerHeight},
  {x:0,y:innerHeight/2},{x:innerWidth,y:innerHeight/2}
 ];
 edges.forEach(p=>{
  for(let i=0;i<50;i++){
   const c=document.createElement("div");
   c.className="confetti";
   c.style.left=p.x+"px";
   c.style.top=p.y+"px";
   c.style.background=`hsl(${Math.random()*360},100%,60%)`;
   c.style.setProperty("--x",(Math.random()*600-300)+"px");
   c.style.setProperty("--y",(Math.random()*600-300)+"px");
   document.body.appendChild(c);
   setTimeout(()=>c.remove(),4000);
  }
 });
}

/* Celebration */
function celebrate(){
 card.innerHTML=`
  <h1 style="font-family:Dancing Script">Yay! 💖</h1>
  <p class="final-line" id="l1"></p><br>
  <p class="final-line" id="l2"></p><br>
  <p class="final-line" id="l3" style="font-size:14px;color:#555"></p>
 `;
 partyPopper();
 setTimeout(()=>l1.innerText="Thank you for being my Valentine 💕",400);
 setTimeout(()=>l2.innerText="I can’t wait to celebrate with you! 🎉",1800);
 setTimeout(()=>l3.innerText="Every love story is beautiful, but ours is my favorite 💞",3200);
}
</script>

</body>
</html>
