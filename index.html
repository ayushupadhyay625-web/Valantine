<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:#ffd6e5;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:92%;
  max-width:380px;
  background:#fff0f6;
  border-radius:26px;
  padding:26px 22px 32px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.18);
  position:relative;
}

.card img{
  width:100%;
  border-radius:18px;
  margin-bottom:18px;
}

h1{
  font-size:24px;
  color:#ff3f7f;
  margin-bottom:8px;
}

#message{
  height:26px;
  margin-bottom:16px;
  color:#ff3f7f;
  font-weight:600;
}

/* Button area */
.area{
  position:relative;
  height:120px;
}

button{
  position:absolute;
  padding:14px 28px;
  border:none;
  border-radius:30px;
  font-size:16px;
}

#yes{
  background:#ff3f7f;
  color:white;
  left:18%;
}

#no{
  background:#ddd;
  left:55%;
}
</style>
</head>

<body>

<div class="card" id="card">
  <img src="https://i.imgur.com/2nCt3Sb.png" alt="cute">
  <h1>Will you be my Valentine? 💖</h1>
  <div id="message"></div>

  <div class="area" id="area">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙄</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const area  = document.getElementById("area");
const msg   = document.getElementById("message");

/* Messages EXACTLY like video style */
const messages = [
  "Nice try 😜",
  "Almost 😏",
  "You can’t press that 😂",
  "Not this one 💃",
  "Only YES allowed 😍",
  "Haha nope 😆"
];

let msgIndex = 0;

/* Move NO button inside area */
function moveNoButton(){
  const areaRect = area.getBoundingClientRect();
  const btnRect  = noBtn.getBoundingClientRect();

  const maxX = areaRect.width  - btnRect.width;
  const maxY = areaRect.height - btnRect.height;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top  = y + "px";

  msg.textContent = messages[msgIndex % messages.length];
  msgIndex++;
}

/* PROXIMITY DETECTION (THIS IS THE CORE) */
function checkDistance(x, y){
  const rect = noBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top  + rect.height / 2;

  const distance = Math.hypot(x - cx, y - cy);

  if(distance < 65){   // tuned to feel like the video
    moveNoButton();
  }
}

/* Desktop */
document.addEventListener("mousemove", e=>{
  checkDistance(e.clientX, e.clientY);
});

/* Mobile */
document.addEventListener("touchmove", e=>{
  const t = e.touches[0];
  checkDistance(t.clientX, t.clientY);
},{passive:true});

/* YES button */
yesBtn.onclick = ()=>{
  card.innerHTML = `
    <h1 style="font-size:30px;color:#ff3f7f;">Yayyyy 💕</h1>
    <p style="font-size:20px;">I Love You 😘</p>
  `;
};
</script>

</body>
</html>
