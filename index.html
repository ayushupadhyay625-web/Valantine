<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}

/* Card */
.container{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(16px);
  padding:28px;
  border-radius:26px;
  width:92%;
  max-width:380px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.card img{
  width:100%;
  border-radius:22px;
  margin-bottom:20px;
}

h1{
  color:#ff1e63;
  font-size:26px;
  margin-bottom:22px;
}

/* Buttons */
.buttons{
  display:flex;
  gap:14px;
}

button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

#yes{
  background:#ff1e63;
  color:white;
  font-weight:600;
}
#yes:hover{transform:scale(1.08);}

#no{background:#e0e0e0;}
</style>
</head>

<body>

<!-- Romantic music -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<div class="container">
  <div class="card" id="card">
    <img src="https://i.imgur.com/2nCt3Sb.png">
    <h1 id="question">Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>
  </div>
</div>

<script>
let name = prompt("Enter her name 💕");
if(!name) name="My Love";

document.getElementById("question").innerText =
`Will you be my Valentine, ${name}? 💖`;

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const music=document.getElementById("music");

noBtn.addEventListener("mouseover",move);
noBtn.addEventListener("touchstart",move);

function move(){
  noBtn.style.transform=
  `translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
}

yesBtn.onclick=()=>{
  music.play();
  confetti();
  document.getElementById("card").innerHTML=`
    <h1 style="font-size:30px;color:#ff1e63;">
      Yayyy ${name} 💕
    </h1>
    <p style="font-size:20px;">
      I Love You So Much 😘
    </p>
  `;
};

// Hearts
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*24)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},350);

// Confetti
function confetti(){
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.innerHTML="🎉";
    c.style.position="fixed";
    c.style.left=Math.random()*100+"vw";
    c.style.top=Math.random()*100+"vh";
    c.style.fontSize="24px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
</script>

</body>
</html>
