<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Puzzle 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f8b6c8,#f6d2d8);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.6;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:22px;
  padding:26px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  animation:fade 0.4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.center{text-align:center}

.top{
  font-size:14px;
  color:#888;
}

.progress{
  height:6px;
  background:#eee;
  border-radius:10px;
  margin:8px 0 18px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:#ff6f91;
  transition:width 0.4s;
}

.question{
  font-family:'Dancing Script',cursive;
  font-size:28px;
  text-align:center;
  margin-bottom:20px;
  color:#333;
}

.options button{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  border:none;
  font-size:15px;
  background:#f5f5f5;
}

.options button:active{
  background:#ffedf3;
}

/* Proposal buttons */
.area{
  position:relative;
  height:120px;
}

#yes{
  background:#ff6f91;
  color:#fff;
  font-weight:600;
  position:absolute;
  left:18%;
}

#no{
  background:#eee;
  position:absolute;
  left:55%;
}

#msg{
  text-align:center;
  font-weight:600;
  color:#ff6f91;
  min-height:22px;
  margin-bottom:10px;
}

.startBtn{
  background:#ff6f91;
  color:#fff;
  padding:14px 26px;
  border-radius:30px;
  border:none;
  font-size:16px;
}

/* FINAL PHOTO SCENE */
.final{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:10;
}

.final img{
  position:absolute;
  border-radius:20px;
}

.girl{
  width:220px;
  transition:transform 2s ease;
}

.boy{
  width:120px;
  left:-150px;
  transition:transform 2s ease;
}

.finalText{
  position:absolute;
  bottom:60px;
  color:white;
  text-align:center;
  font-size:24px;
  font-family:'Dancing Script',cursive;
  opacity:0;
  transition:opacity 2s ease;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");
let started=false;

function playMusic(){
  if(!started){
    music.play().catch(()=>{});
    started=true;
  }
}

/* QUESTIONS */
const quiz=[
  {
    q:"Where did we first meet?",
    o:["At a coffee shop ☕","Through mutual friends 👥","Online 💻","At work/school 🏫"]
  },
  {
    q:"What's our favorite activity together?",
    o:["Watching movies 🎬","Cooking together 🍳","Playing games 🎮","Going on a dinner date 🍽️"]
  },
  {
    q:"What's our song?",
    o:[
      "Perfect – Ed Sheeran 🎵",
      "All of Me – John Legend 🎤",
      "Can't Help Falling in Love – Elvis 💕",
      "A Thousand Years – Christina Perri 🎶"
    ]
  }
];

let step=-1;

/* INTRO – SPECIAL PUZZLE */
function intro(){
  card.innerHTML=`
    <div class="center">
      <div class="question">A Special Puzzle 💖</div>
      <p>Just for you, Manshi</p><br>
      <button class="startBtn" onclick="next()">Start</button>
    </div>
  `;
}

/* QUESTIONS */
function renderQuestion(){
  card.innerHTML=`
    <div class="top">Question ${step+1} of 3</div>
    <div class="progress">
      <div class="bar" style="width:${(step+1)/3*100}%"></div>
    </div>
    <div class="question">${quiz[step].q}</div>
    <div class="options">
      ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
    </div>
  `;
}

/* FINAL PROPOSAL */
const messages=[
  "Nice try 😜",
  "Almost 😏",
  "Haha nope 😂",
  "You can’t press this 💃",
  "Only YES allowed 😍"
];
let mi=0;

function proposal(){
  card.innerHTML=`
    <div class="question">Manshi 💖</div>
    <p class="center">Will you be my Valentine?</p>
    <div id="msg"></div>
    <div class="area" id="area">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>
  `;

  const no=document.getElementById("no");
  const yes=document.getElementById("yes");
  const msg=document.getElementById("msg");
  const area=document.getElementById("area");

  function moveNo(){
    const ar=area.getBoundingClientRect();
    const br=no.getBoundingClientRect();
    no.style.left=Math.random()*(ar.width-br.width)+"px";
    no.style.top=Math.random()*(ar.height-br.height)+"px";
    msg.innerText=messages[mi];
    mi=(mi+1)%messages.length;
  }

  document.addEventListener("mousemove",e=>{
    const r=no.getBoundingClientRect();
    if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<60){
      moveNo();
    }
  });

  document.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    const r=no.getBoundingClientRect();
    if(Math.hypot(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2))<60){
      moveNo();
    }
  },{passive:true});

  yes.onclick=finalScene;
}

/* FINAL PHOTO ANIMATION */
function finalScene(){
  playMusic();
  card.style.display="none";

  const scene=document.createElement("div");
  scene.className="final";
  scene.innerHTML=`
    <img src="images/girl.jpg" class="girl">
    <img src="images/boy.jpg" class="boy">
    <div class="finalText">Manshi 💖<br>Will you stay with me forever?</div>
  `;
  document.body.appendChild(scene);

  const boy=scene.querySelector(".boy");
  const girl=scene.querySelector(".girl");
  const text=scene.querySelector(".finalText");

  setTimeout(()=>{ boy.style.transform="translateX(240px)"; },300);
  setTimeout(()=>{ girl.style.transform="scale(1.4)"; },1700);
  setTimeout(()=>{ text.style.opacity="1"; },2600);
}

function next(){
  playMusic();
  step++;
  if(step<quiz.length){
    renderQuestion();
  }else{
    proposal();
  }
}

/* Hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},500);

intro();
</script>

</body>
</html>
