<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Manshi 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f8b6c8,#f6d2d8);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.7;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  animation:fade 0.4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.top{font-size:14px;color:#888}

.progress{
  height:6px;background:#eee;border-radius:10px;
  margin:8px 0 20px;overflow:hidden;
}
.bar{
  height:100%;background:#ff6f91;
  transition:width 0.4s;
}

.question{
  font-family:'Dancing Script',cursive;
  font-size:30px;
  text-align:center;
  margin-bottom:18px;
  color:#333;
}

.options button{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:14px;
  border:none;
  font-size:15px;
  background:#f5f5f5;
}
.options button:hover{background:#ffedf3}

/* Proposal */
.area{height:140px;position:relative}

#yes{
  background:#ff6f91;
  color:#fff;
  font-weight:600;
  padding:14px 26px;
  border-radius:30px;
  font-size:18px;
  position:absolute;
  left:35%;
  transition:transform 0.2s ease;
}

#no{
  background:#eee;
  padding:14px 22px;
  border-radius:30px;
  position:fixed;
  transition:all 0.15s ease;
}

#msg{
  text-align:center;
  font-weight:600;
  color:#ff6f91;
  min-height:24px;
  margin-bottom:10px;
}

/* Video */
#loveVideo{
  display:none;
  width:100%;
  max-width:420px;
  border-radius:20px;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<!-- Replace with your own video OR base64 version -->
<video id="loveVideo" controls playsinline>
  <source src="VID_20260205_170144_080.mp4" type="video/mp4">
</video>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");
const video=document.getElementById("loveVideo");

let started=false;
let step=0;

const quiz=[
  {q:"Where did we first meet?",
   o:["At a coffee shop ☕","Through friends 👥","Online 💻","At college 🏫"]},
  {q:"What do you love most about us?",
   o:["Our talks 💬","Our laughs 😂","Our bond 💞","Everything 😍"]},
  {q:"Are you ready for something special?",
   o:["Yes 💖","Definitely 😘","Of course 🥰","Always 💕"]}
];

function playMusic(){
  if(!started){
    music.play().catch(()=>{});
    started=true;
  }
}

function render(){
  if(step<quiz.length){
    card.innerHTML=`
      <div class="top">Question ${step+1} of 3</div>
      <div class="progress">
        <div class="bar" style="width:${(step+1)/3*100}%"></div>
      </div>
      <div class="question">${quiz[step].q}</div>
      <div class="options">
        ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
      </div>`;
  }else proposal();
}

function next(){
  playMusic();
  step++;
  render();
}

/* FINAL PROPOSAL */
function proposal(){
  card.innerHTML=`
    <div class="question">Manshi 💖</div>
    <p style="text-align:center;font-size:18px">
      Will you stay with me forever? 💍
    </p>
    <div id="msg"></div>
    <div class="area">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>`;

  const no=document.getElementById("no");
  const yes=document.getElementById("yes");
  const msg=document.getElementById("msg");

  let yesScale=1;

  function moveNo(){
    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-60);

    no.style.left=x+"px";
    no.style.top=y+"px";

    yesScale+=0.18;
    yes.style.transform=`scale(${yesScale})`;

    msg.innerText="You can’t say no 😏";
  }

  no.addEventListener("mouseover",moveNo);
  no.addEventListener("touchstart",moveNo);

  yes.onclick=()=>{
    music.pause();
    card.style.display="none";
    document.body.style.background="linear-gradient(135deg,#ff9a9e,#fad0c4)";
    video.style.display="block";
    video.play();
  };
}

render();

/* Floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},500);
</script>

</body>
</html>
