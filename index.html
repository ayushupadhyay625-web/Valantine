<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Puzzle 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:#ffd6e5;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Card */
.card{
  background:#ffeaf2;
  width:92%;
  max-width:380px;
  padding:30px 22px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
  animation:fade 0.6s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

h1{
  color:#ff4d88;
  margin-bottom:10px;
}

p{
  color:#555;
  font-size:14px;
  margin-bottom:25px;
}

/* Buttons */
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:25px;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

.primary{
  background:#ff4d88;
  color:white;
  font-weight:600;
}

.option{
  background:white;
  border:2px solid #ffb6cf;
}

button:hover{
  transform:scale(1.03);
}

/* Hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 6s linear infinite;
}

@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>
const app=document.getElementById("app");

const screens=[
  {
    html:`
      <h1>A Special Puzzle 💕</h1>
      <p>Just for you</p>
      <button class="primary" onclick="next()">Start 💖</button>
    `
  },
  {
    html:`
      <h1>Question 1 💗</h1>
      <p>When did we first meet?</p>
      <button class="option" onclick="next()">At college 😄</button>
      <button class="option" onclick="next()">Through mutual friends 💫</button>
      <button class="option" onclick="next()">Destiny ✨</button>
    `
  },
  {
    html:`
      <h1>Question 2 💕</h1>
      <p>What do you like the most about us?</p>
      <button class="option" onclick="next()">Our bonding ❤️</button>
      <button class="option" onclick="next()">Our memories 📸</button>
      <button class="option" onclick="next()">Everything 🥰</button>
    `
  },
  {
    html:`
      <h1>Almost There 💖</h1>
      <p>I have something important to ask you…</p>
      <button class="primary" onclick="next()">Continue 💝</button>
    `
  },
  {
    html:`
      <h1>Will you be my Valentine? 💍</h1>
      <button class="primary" onclick="yes()">Yes 😍</button>
      <button class="option" id="no">No 🙄</button>
    `
  }
];

let index=0;

function render(){
  app.innerHTML=screens[index].html;
  if(index===screens.length-1){
    const no=document.getElementById("no");
    no.onmouseover=no.ontouchstart=()=>{
      no.style.transform=
      `translate(${Math.random()*120-60}px,${Math.random()*80-40}px)`;
    };
  }
}

function next(){
  index++;
  render();
}

function yes(){
  app.innerHTML=`
    <h1>Yayyyy 💕</h1>
    <p>I Love You So Much 😘</p>
  `;
}

render();

/* Floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);
</script>

</body>
</html>
