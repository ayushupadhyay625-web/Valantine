<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Manshi 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f8b6c8,#f6d2d8);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:0.8;
}
@keyframes float{
  to{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:22px;
  padding:26px;
  box-shadow:0 25px 50px rgba(0,0,0,0.18);
  animation:fade 0.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

.top{font-size:14px;color:#888}

.progress{
  height:6px;background:#eee;border-radius:10px;
  margin:10px 0 22px;overflow:hidden;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#ff6f91,#ff9a9e);
  transition:width 0.4s;
}

.question{
  font-family:'Dancing Script',cursive;
  font-size:30px;
  text-align:center;
  margin-bottom:20px;
  color:#333;
}

/* Quiz buttons */
.options button{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:18px;
  border:none;
  font-size:15px;
  background:linear-gradient(135deg,#ffe1ea,#ffd1dc);
  cursor:pointer;
  transition:transform .2s, box-shadow .2s;
}
.options button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 20px rgba(255,111,145,.35);
}

/* Proposal */
.area{height:150px;position:relative;margin-top:10px}

#yes{
  background:linear-gradient(135deg,#ff6f91,#ff9a9e);
  color:#fff;
  font-weight:600;
  padding:15px 30px;
  border-radius:40px;
  font-size:18px;
  position:absolute;
  left:32%;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,111,145,.6);
  animation:pulse 1.6s infinite;
  transition:transform 0.2s;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

#no{
  background:#f0f0f0;
  padding:15px 26px;
  border-radius:40px;
  position:fixed;
  cursor:pointer;
  transition:all .15s ease;
}

#msg{
  text-align:center;
  font-weight:600;
  color:#ff6f91;
  min-height:26px;
}

/* Fireworks */
.spark{
  position:fixed;
  font-size:22px;
  animation:boom 1.5s ease-out forwards;
}
@keyframes boom{
  to{transform:translate(var(--x),var(--y)) scale(1.8);opacity:0}
}
</style>
</head>

<body>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");

let step=0;
const quiz=[
  {q:"Where did we first meet?",
   o:["At a coffee shop ☕","Through friends 👥","Online 💻","At college 🏫"]},
  {q:"What do you love most about us?",
   o:["Our talks 💬","Our laughs 😂","Our bond 💞","Everything 😍"]},
  {q:"Do you know how special you are to me?",
   o:["Very 💕","A lot 🥰","Too much 😘","Infinite ♾️"]},
];

function render(){
  if(step<quiz.length){
    card.innerHTML=`
      <div class="top">Puzzle ${step+1} of 3</div>
      <div class="progress">
        <div class="bar" style="width:${(step+1)/3*100}%"></div>
      </div>
      <div class="question">${quiz[step].q}</div>
      <div class="options">
        ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
      </div>`;
  }else proposal();
}

function next(){
  step++;
  render();
}

/* FINAL PROPOSAL */
function proposal(){
  card.innerHTML=`
    <div class="question">Manshi 💖</div>
    <p style="text-align:center;font-size:18px">
      Will you stay with me forever? 💍
    </p>
    <div id="msg"></div>
    <div class="area">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>`;

  const yes=document.getElementById("yes");
  const no=document.getElementById("no");
  const msg=document.getElementById("msg");

  let yesScale=1;

  function moveNo(){
    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-60);
    no.style.left=x+"px";
    no.style.top=y+"px";
    yesScale+=0.15;
    yes.style.transform=`scale(${yesScale})`;
    msg.innerText="Haha 😜 you can’t say no!";
  }

  no.addEventListener("mouseover",moveNo);
  no.addEventListener("touchstart",moveNo);

  yes.onclick=()=>{
    card.innerHTML=`
      <div class="question">I knew it 💖</div>
      <p style="text-align:center;font-size:18px">
        You are my today, my tomorrow, and my forever 🥰<br><br>
        Thank you for choosing me ❤️
      </p>`;
    fireworks();
  };
}

render();

/* Floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(18+Math.random()*24)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},450);

/* Fireworks */
function fireworks(){
  for(let i=0;i<40;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.innerHTML="✨";
    s.style.left="50%";
    s.style.top="50%";
    s.style.setProperty("--x",(Math.random()*400-200)+"px");
    s.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1500);
  }
}
</script>

</body>
</html>
