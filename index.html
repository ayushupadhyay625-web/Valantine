<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 💖</title>

<!-- Romantic handwritten font (video-style) -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  background:linear-gradient(135deg,#ffd6e5,#ffeef5);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Dancing Script',cursive;
}

.card{
  width:92%;
  max-width:380px;
  background:#fff0f6;
  border-radius:26px;
  padding:26px 22px 32px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.18);
}

h1{
  color:#ff3f7f;
  font-size:28px;
  margin-bottom:8px;
}

p{
  color:#555;
  font-size:18px;
  margin-bottom:16px;
}

#message{
  min-height:30px;
  color:#ff3f7f;
  font-size:20px;
  margin-bottom:10px;
}

/* Buttons */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:25px;
  font-size:18px;
  background:white;
  border:2px solid #ffb6cf;
  font-family:'Dancing Script',cursive;
}

.primary{
  background:#ff3f7f;
  color:white;
  border:none;
}

/* Final area */
#finalArea{
  position:relative;
  height:120px;
}

#yes{
  background:#ff3f7f;
  color:white;
  position:absolute;
  left:18%;
  width:auto;
  padding:14px 30px;
}

#no{
  background:#ddd;
  position:absolute;
  left:55%;
  width:auto;
  padding:14px 30px;
}
</style>
</head>

<body>

<!-- Bollywood-style romantic instrumental -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");
let musicStarted=false;

function playMusic(){
  if(!musicStarted){
    music.play().catch(()=>{});
    musicStarted=true;
  }
}

/* INTRO (FIRST 3 STEPS) */
const intro=[
  {h:"A Special Puzzle 💕",p:"Just for you"},
  {h:"Before we begin 😌",p:"Please answer honestly"},
  {h:"Ready? 💖",p:"Let’s start"}
];
let ii=0;

function showIntro(){
  const s=intro[ii];
  card.innerHTML=`
    <h1>${s.h}</h1>
    <p>${s.p}</p>
    <button class="primary" onclick="nextIntro()">Continue</button>`;
}

function nextIntro(){
  ii++;
  ii<intro.length ? showIntro() : finalIntro();
}

/* FINAL INTRO */
function finalIntro(){
  card.innerHTML=`
    <h1>One last question 💕</h1>
    <p>Please think carefully 😌</p>
    <button class="primary" onclick="finalQuestion()">Continue</button>`;
}

/* FINAL QUESTION */
const noMessages=[
  "Nice try 😜",
  "Almost 😏",
  "Haha nope 😂",
  "You can’t press this 💃",
  "Only YES allowed 😍"
];
let noIndex=0;

function finalQuestion(){
  playMusic();

  card.innerHTML=`
    <h1>Will you be my Valentine? 💖</h1>
    <div id="message"></div>
    <div id="finalArea">
      <button id="yes" onclick="yes()">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>`;

  const noBtn=document.getElementById("no");
  const msg=document.getElementById("message");
  const area=document.getElementById("finalArea");

  function moveNo(){
    const ar=area.getBoundingClientRect();
    const br=noBtn.getBoundingClientRect();
    noBtn.style.left=Math.random()*(ar.width-br.width)+"px";
    noBtn.style.top=Math.random()*(ar.height-br.height)+"px";

    // MESSAGE CHANGES WITH NO MOVE (EXACT)
    msg.innerText = noMessages[noIndex];
    noIndex = (noIndex+1) % noMessages.length;
  }

  document.addEventListener("mousemove",e=>{
    const r=noBtn.getBoundingClientRect();
    if(Math.hypot(
      e.clientX-(r.left+r.width/2),
      e.clientY-(r.top+r.height/2)
    )<65) moveNo();
  });

  document.addEventListener("touchmove",e=>{
    const t=e.touches[0];
    const r=noBtn.getBoundingClientRect();
    if(Math.hypot(
      t.clientX-(r.left+r.width/2),
      t.clientY-(r.top+r.height/2)
    )<65) moveNo();
  },{passive:true});
}

/* YES */
function yes(){
  card.innerHTML=`
    <h1>I knew it 💕</h1>
    <p>I Love You 😘</p>`;
}

/* START */
showIntro();
</script>

</body>
</html>
