<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 6s linear infinite;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0;}
}

/* Card */
.card{
  background:rgba(255,255,255,0.3);
  backdrop-filter:blur(15px);
  padding:30px 22px;
  border-radius:26px;
  width:92%;
  max-width:380px;
  text-align:center;
  box-shadow:0 20px 45px rgba(0,0,0,0.25);
}

.card img{
  width:100%;
  border-radius:20px;
  margin-bottom:20px;
}

h1{
  color:#ff2f6d;
  font-size:26px;
  margin-bottom:15px;
}

#tease{
  min-height:24px;
  margin-bottom:18px;
  color:#ff2f6d;
  font-weight:600;
}

/* Buttons */
.buttons{
  position:relative;
  height:90px;
}

button{
  padding:14px 26px;
  font-size:16px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  position:absolute;
  transition:0.2s;
}

#yes{
  background:#ff2f6d;
  color:white;
  left:20%;
}

#no{
  background:#ddd;
  right:20%;
}
</style>
</head>

<body>

<div class="card" id="card">
  <img src="https://i.imgur.com/2nCt3Sb.png" alt="cute">
  <h1>Will you be my Valentine? 💖</h1>

  <p id="tease"></p>

  <div class="buttons">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙄</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const tease = document.getElementById("tease");

/* Teasing messages (video style) */
const messages = [
  "Nice try 😜",
  "Oops! Almost 😏",
  "Haha, not happening 💃",
  "You can't catch me 😆",
  "Say YES already 😍",
  "Why so cute trying 😂"
];

/* Move NO button */
function moveNo(){
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 120 - 60;

  noBtn.style.transform = `translate(${x}px,${y}px)`;

  tease.innerText = messages[Math.floor(Math.random()*messages.length)];
}

/* Desktop hover */
noBtn.addEventListener("mouseover", moveNo);

/* Mobile touch */
noBtn.addEventListener("touchstart", (e)=>{
  e.preventDefault();
  moveNo();
});

/* YES click */
yesBtn.onclick = ()=>{
  document.getElementById("card").innerHTML = `
    <h1 style="font-size:30px;">Yayyyy 💕</h1>
    <p style="font-size:20px;color:#ff2f6d;">
      I Love You 😘
    </p>
  `;
};

/* Floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(16+Math.random()*22)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);
</script>

</body>
</html>
