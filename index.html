<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  height:100vh;background:#ffd6e5;display:flex;justify-content:center;align-items:center;
}
.card{
  width:92%;max-width:380px;background:#fff0f6;border-radius:26px;
  padding:26px 22px 32px;text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.18);
}
h1{color:#ff3f7f;font-size:23px;margin-bottom:8px;}
p{color:#666;font-size:14px;margin-bottom:18px;}

#message{
  min-height:28px;color:#ff3f7f;font-weight:600;margin-bottom:6px;
}
#counter{
  font-size:12px;color:#999;margin-bottom:10px;
}

button{
  width:100%;padding:14px;margin-top:10px;border:none;border-radius:25px;
  font-size:15px;background:white;border:2px solid #ffb6cf;
}
.primary{background:#ff3f7f;color:white;border:none;}

#finalArea{position:relative;height:120px;}
#yes{background:#ff3f7f;color:white;position:absolute;left:18%;width:auto;padding:14px 28px;}
#no{background:#ddd;position:absolute;left:55%;width:auto;padding:14px 28px;}

/* Shake animation */
@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  50%{transform:translateX(4px);}
  75%{transform:translateX(-4px);}
  100%{transform:translateX(0);}
}
</style>
</head>

<body>

<!-- Background romantic music -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3">
</audio>

<!-- NO escape sound -->
<audio id="escape">
  <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3">
</audio>

<div class="card" id="card"></div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");
const escapeSound=document.getElementById("escape");
let musicStarted=false;

function playMusic(){
  if(!musicStarted){
    music.play().catch(()=>{});
    musicStarted=true;
  }
}

/* Typing effect */
function typeText(el,text,speed=28){
  el.textContent="";
  let i=0;
  const t=setInterval(()=>{
    el.textContent+=text[i++];
    if(i>=text.length) clearInterval(t);
  },speed);
}

/* -------- INTRO (FIRST 3 STEPS) -------- */
const intro=[
  {h:"A Special Puzzle 💕",p:"Just for you"},
  {h:"Before we begin 😌",p:"There are no wrong answers… mostly 😜"},
  {h:"Ready? 💖",p:"Let’s start"}
];
let ii=0;
function showIntro(){
  const s=intro[ii];
  card.innerHTML=`
    <h1>${s.h}</h1>
    <p>${s.p}</p>
    <button class="primary" onclick="nextIntro()">Continue</button>`;
}
function nextIntro(){
  ii++; ii<intro.length ? showIntro() : showQuestion();
}

/* -------- QUESTIONS -------- */
const questions=[
  {q:"When did we first meet?",opts:["By destiny ✨","At college 😄"],correct:0},
  {q:"What do you like the most about us?",opts:["Everything 🥰","Our bonding ❤️"],correct:0}
];
let qi=0;

function showQuestion(){
  const q=questions[qi];
  card.innerHTML=`
    <h1>${q.q}</h1>
    <div id="message"></div>
    ${q.opts.map((o,i)=>`<button onclick="answer(${i})">${o}</button>`).join("")}`;
}

function answer(i){
  playMusic();
  const m=document.getElementById("message");
  typeText(m, i===questions[qi].correct ? "Correct 💖" : "Hmm… not quite 😅");
  setTimeout(()=>{ qi++; qi<questions.length ? showQuestion() : finalIntro(); },1200);
}

/* -------- FINAL INTRO -------- */
function finalIntro(){
  card.innerHTML=`
    <h1>Okay… 🥺</h1>
    <p>One last important question</p>
    <button class="primary" onclick="finalQuestion()">Continue 💝</button>`;
}

/* -------- FINAL QUESTION -------- */
const noMessages=[
  "Nice try 😜",
  "Almost 😏",
  "Haha nope 😂",
  "You can’t press this 💃",
  "Only YES allowed 😍",
  "Okay okay… enough 😅"
];
let noIdx=0, attempts=0;

function finalQuestion(){
  card.innerHTML=`
    <h1>Will you be my Valentine? 💖</h1>
    <div id="message"></div>
    <div id="counter"></div>
    <div id="finalArea">
      <button id="yes" onclick="yes()">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>`;

  const noBtn=document.getElementById("no");
  const msg=document.getElementById("message");
  const cnt=document.getElementById("counter");
  const area=document.getElementById("finalArea");

  function moveNo(){
    // shake before escape
    noBtn.style.animation="shake 0.25s";
    setTimeout(()=>{ noBtn.style.animation=""; },250);

    setTimeout(()=>{
      const ar=area.getBoundingClientRect(), br=noBtn.getBoundingClientRect();
      noBtn.style.left=Math.random()*(ar.width-br.width)+"px";
      noBtn.style.top=Math.random()*(ar.height-br.height)+"px";

      attempts++;
      escapeSound.currentTime=0;
      escapeSound.play().catch(()=>{});

      typeText(msg, noMessages[Math.min(noIdx,noMessages.length-1)]);
      cnt.textContent = `Try ${attempts}`;
      noIdx++;
    },220);
  }

  document.addEventListener("mousemove",e=>{
    const r=noBtn.getBoundingClientRect();
    if(Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2))<65) moveNo();
  });

  document.addEventListener("touchmove",e=>{
    const t=e.touches[0], r=noBtn.getBoundingClientRect();
    if(Math.hypot(t.clientX-(r.left+r.width/2), t.clientY-(r.top+r.height/2))<65) moveNo();
  },{passive:true});
}

/* -------- YES -------- */
function yes(){
  card.innerHTML=`
    <h1>I knew it 💕</h1>
    <p style="font-size:17px;color:#ff3f7f;">
      Thank you for choosing me.<br>
      I promise to make you smile every day 😘
    </p>`;
}

/* START */
showIntro();
</script>

</body>
</html>
