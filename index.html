<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Puzzle 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#f9b3c9,#f7d1db);
  font-family:'Poppins',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Floating hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:18px;
  animation:float 7s linear infinite;
  opacity:.8;
}
@keyframes float{
  to{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

/* Card */
.card{
  width:92%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 25px 50px rgba(0,0,0,.2);
  animation:fade .5s ease;
  text-align:center;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.title{
  font-family:'Dancing Script',cursive;
  font-size:36px;
  color:#333;
}

.subtitle{
  color:#ff6f91;
  font-size:18px;
  margin:10px 0;
}

.desc{
  color:#666;
  font-size:14px;
  margin-bottom:25px;
}

/* Buttons */
.btn{
  background:linear-gradient(135deg,#ff6f91,#ff9a9e);
  color:#fff;
  border:none;
  padding:14px 30px;
  border-radius:40px;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(255,111,145,.6);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

/* Progress */
.top{font-size:14px;color:#888}
.progress{
  height:6px;background:#eee;border-radius:10px;
  margin:10px 0 22px;overflow:hidden;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#ff6f91,#ff9a9e);
}

/* Questions */
.question{
  font-family:'Dancing Script',cursive;
  font-size:30px;
  margin-bottom:20px;
}

.options button{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:18px;
  border:none;
  font-size:15px;
  background:linear-gradient(135deg,#ffe1ea,#ffd1dc);
  cursor:pointer;
  transition:.2s;
}
.options button:hover{
  transform:scale(1.05);
}

/* Proposal */
.area{height:150px;position:relative;margin-top:10px}

#yes{
  background:linear-gradient(135deg,#ff6f91,#ff9a9e);
  color:#fff;
  padding:15px 34px;
  border-radius:40px;
  font-size:18px;
  position:absolute;
  left:32%;
  box-shadow:0 0 20px rgba(255,111,145,.6);
  animation:pulse 1.4s infinite;
  transition:transform .2s;
}

#no{
  background:#eee;
  padding:15px 28px;
  border-radius:40px;
  position:fixed;
  cursor:pointer;
  transition:.15s;
}

#msg{
  color:#ff6f91;
  font-weight:600;
  min-height:26px;
}

/* Fireworks */
.spark{
  position:fixed;
  font-size:22px;
  animation:boom 1.4s ease-out forwards;
}
@keyframes boom{
  to{transform:translate(var(--x),var(--y)) scale(1.8);opacity:0}
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="title">❤️</div>
  <div class="title">A Special Puzzle</div>
  <div class="subtitle">Just For You 💖</div>
  <div class="desc">Answer a few questions to unlock something special…</div>
  <button class="btn" onclick="start()">❤️ Start ✨</button>
  <p style="margin-top:20px;font-size:12px;color:#999;">Made with love 💕</p>
</div>

<script>
const card=document.getElementById("card");

const quiz=[
 {q:"Where did we first meet?",
  o:["At a coffee shop ☕","Through friends 👥","Online 💻","At college 🏫"]},
 {q:"What do you love most about us?",
  o:["Our talks 💬","Our laughs 😂","Our bond 💞","Everything 😍"]},
 {q:"Do you know how special you are to me?",
  o:["Very 💕","A lot 🥰","Too much 😘","Infinite ♾️"]}
];

let step=0;

function start(){
  render();
}

function render(){
  if(step<quiz.length){
    card.innerHTML=`
      <div class="top">Puzzle ${step+1} of ${quiz.length}</div>
      <div class="progress"><div class="bar" style="width:${(step+1)/quiz.length*100}%"></div></div>
      <div class="question">${quiz[step].q}</div>
      <div class="options">
        ${quiz[step].o.map(x=>`<button onclick="next()">${x}</button>`).join("")}
      </div>`;
  }else proposal();
}

function next(){
  step++;
  render();
}

function proposal(){
  card.innerHTML=`
    <div class="question">Manshi 💖</div>
    <p>Will you stay with me forever? 💍</p>
    <div id="msg"></div>
    <div class="area">
      <button id="yes">Yes 😍</button>
      <button id="no">No 🙄</button>
    </div>`;

  const yes=document.getElementById("yes");
  const no=document.getElementById("no");
  const msg=document.getElementById("msg");

  let scale=1;

  function moveNo(){
    no.style.left=Math.random()*(innerWidth-120)+"px";
    no.style.top=Math.random()*(innerHeight-60)+"px";
    scale+=0.15;
    yes.style.transform=`scale(${scale})`;
    msg.innerText="You can’t say no 😜";
  }

  no.addEventListener("mouseover",moveNo);
  no.addEventListener("touchstart",moveNo);

  yes.onclick=()=>{
    card.innerHTML=`
      <div class="question">I knew it 💖</div>
      <p>You are my today, my tomorrow, and my forever 🥰</p>`;
    fireworks();
  };
}

/* Hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(18+Math.random()*24)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},450);

/* Fireworks */
function fireworks(){
  for(let i=0;i<40;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.innerHTML="✨";
    s.style.left="50%";
    s.style.top="50%";
    s.style.setProperty("--x",(Math.random()*400-200)+"px");
    s.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1400);
  }
}
</script>

</body>
</html>
