<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Poppins',sans-serif;
}

.card{
  width:90%;
  max-width:380px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(20px);
  border-radius:30px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  animation:pop 0.6s ease;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  font-family:'Dancing Script',cursive;
  color:#fff;
  font-size:34px;
  margin-bottom:10px;
}

p{
  color:#fff;
  margin-bottom:20px;
}

#msg{
  min-height:26px;
  color:#fff;
  font-weight:600;
  margin-bottom:10px;
}

.area{
  position:relative;
  height:130px;
}

button{
  padding:14px 30px;
  border-radius:30px;
  border:none;
  font-size:16px;
}

#yes{
  background:#fff;
  color:#ff4f7a;
  font-weight:600;
  position:absolute;
  left:20%;
}

#no{
  background:#eee;
  position:absolute;
  left:55%;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3">
</audio>

<div class="card" id="card">
  <h1>Will you be my Valentine? 💖</h1>
  <p id="msg"></p>

  <div class="area" id="area">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙄</button>
  </div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const msg=document.getElementById("msg");
const music=document.getElementById("music");
let started=false;

const texts=[
  "Nice try 😜",
  "Almost 😏",
  "Haha nope 😂",
  "You can’t press this 💃",
  "Only YES allowed 😍"
];
let i=0;

function play(){
  if(!started){
    music.play().catch(()=>{});
    started=true;
  }
}

function moveNo(){
  play();
  const area=document.getElementById("area");
  const ar=area.getBoundingClientRect();
  const br=noBtn.getBoundingClientRect();

  noBtn.style.left=Math.random()*(ar.width-br.width)+"px";
  noBtn.style.top=Math.random()*(ar.height-br.height)+"px";

  msg.innerText=texts[i];
  i=(i+1)%texts.length;
}

document.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  const r=noBtn.getBoundingClientRect();
  if(Math.hypot(t.clientX-(r.left+r.width/2),t.clientY-(r.top+r.height/2))<70){
    moveNo();
  }
},{passive:true});

document.addEventListener("mousemove",e=>{
  const r=noBtn.getBoundingClientRect();
  if(Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))<70){
    moveNo();
  }
});

yesBtn.onclick=()=>{
  play();
  document.getElementById("card").innerHTML=
  "<h1>I knew it 💕</h1><p>You made my day 😘</p>";
};
</script>

</body>
</html>
